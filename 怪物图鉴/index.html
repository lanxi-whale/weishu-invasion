<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>怪物图鉴 · 卫戍协议</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 500px at 60% -10%,rgba(26,72,64,.45),transparent 60%),#080b0c;
  color:#d8e3de;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:40px 40px}
.top{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid #1d2b29;
  background:linear-gradient(180deg,rgba(10,16,16,.96),rgba(8,11,12,.8));z-index:3}
.logo{width:34px;height:34px;display:grid;place-items:center;color:#0b1211;font-weight:800;
  background:linear-gradient(160deg,#5fd6bb,#2b8d78);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
h1{font-size:17px;letter-spacing:.16em;font-weight:700}
.sub{font-size:9px;letter-spacing:.3em;color:#4e8f80}
.topstat{margin-left:auto;display:flex;gap:20px;font-size:12px;color:#7e9a92;align-items:center}
.topstat b{color:#5fd6bb;font-size:15px;margin-left:5px}
.tool{background:#12201d;border:1px solid #24403a;color:#8fb8ac;font-size:12px;padding:6px 12px;cursor:pointer}
.tool:hover{border-color:#5fd6bb;color:#5fd6bb}
.main{flex:1;display:grid;grid-template-columns:200px 1fr 330px;min-height:0}
.side{border-right:1px solid #17211f;overflow-y:auto;padding:14px 10px}
.side h2{font-size:11px;letter-spacing:.24em;color:#4e8f80;margin:2px 0 10px 8px}
.fac{display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;border-left:2px solid transparent;
  font-size:13px;color:#9db3ad;transition:.12s;user-select:none}
.fac:hover{background:rgba(95,214,187,.06);color:#d8e3de}
.fac.on{background:rgba(95,214,187,.12);border-left-color:#5fd6bb;color:#fff}
.fac .dot{width:7px;height:7px;transform:rotate(45deg);background:#2f4a45;flex:none}
.fac.on .dot{background:#5fd6bb}
.fac .n{margin-left:auto;font-size:11px;color:#5f7b75;font-variant-numeric:tabular-nums}
.fac .x{margin-left:6px;color:#5f4a4a;font-size:11px;opacity:0}
.fac:hover .x{opacity:1}
.fac .x:hover{color:#e07a7a}
.newfac{margin:10px 8px;padding:8px;border:1px dashed #2b4a44;text-align:center;font-size:12px;color:#5f8f84;cursor:pointer}
.newfac:hover{border-color:#5fd6bb;color:#5fd6bb}
.center{display:flex;flex-direction:column;min-height:0}
.filters{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #17211f;flex-wrap:wrap}
.chip{padding:5px 13px;font-size:12px;border:1px solid #223230;color:#8aa39c;cursor:pointer;background:transparent}
.chip.on{background:#16302b;border-color:#5fd6bb;color:#5fd6bb}
.tag.minor{border-color:#3b3357;color:#a294d8;background:#171327}
.dot.minor{background:#8b7fc7}
#subFilters{padding-top:0;border-bottom:1px solid #17211f}
#subFilters .chip{font-size:11px;padding:4px 10px;background:#0f1917;border-color:#1d2a28}
#subFilters .chip.on{background:#16302b;border-color:#5fd6bb;color:#5fd6bb}
.tag.minor{border-color:#3b3357;color:#a294d8;background:#171327}
.dot.minor{background:#8b7fc7}
#subFilters .chip:first-child{color:#8aa39c;border-style:dashed}
.search{margin-left:auto;background:#0d1514;border:1px solid #223230;color:#d8e3de;padding:6px 12px;font-size:12px;width:210px;outline:none}
.search:focus{border-color:#5fd6bb}
.list{flex:1;overflow-y:auto;padding:6px 10px 20px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:8px 10px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.04)}
.row:hover{background:rgba(95,214,187,.06)}
.row.on{background:rgba(95,214,187,.13);box-shadow:inset 3px 0 0 #5fd6bb}
.ic{width:52px;height:52px;border:1px solid #223230;background:#0d1514;display:grid;place-items:center;overflow:hidden;flex:none}
.ic img{width:100%;height:100%;object-fit:contain}
.nm{font-size:14px;color:#e6efeb;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 6px;border:1px solid #2b4a44;color:#7fb3a6}
.tag.boss{border-color:#8a3a44;color:#e07a7a}
.tag.elite{border-color:#8a6a3a;color:#e0b47a}
.tag.fac{border-color:#3a5a8a;color:#8fb4e0}
.meta{font-size:11px;color:#6d8781;margin-top:4px;display:flex;gap:12px}
.stats{text-align:right;font-size:11px;color:#7e9a92;font-variant-numeric:tabular-nums;line-height:1.7}
.stats b{color:#c8d8d3}
.detail{border-left:1px solid #17211f;padding:18px 16px;overflow-y:auto}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dhead .ic{width:76px;height:76px}
.dname{font-size:19px;font-weight:700;color:#eaf3ef}
.dfac{font-size:11px;color:#5fd6bb;margin-top:6px;letter-spacing:.1em}
.drank{display:inline-block;margin-top:8px;font-size:10px;padding:2px 8px;border:1px solid #2b4a44;color:#8fb8ac}
.sect{margin-top:18px}
.sect h3{font-size:10px;letter-spacing:.24em;color:#4e8f80;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{background:#0d1514;border:1px solid #1a2726;padding:6px 9px;font-size:11px;color:#7e9a92;display:flex;justify-content:space-between}
.kv b{color:#d8e3de;font-weight:600}
.achips{display:flex;flex-wrap:wrap;gap:6px}
.ac{font-size:10px;padding:2px 8px;background:#12201d;border:1px solid #24403a;color:#7fb3a6}
.desc{font-size:12px;line-height:1.8;color:#8aa39c;background:#0d1514;border:1px solid #1a2726;padding:10px 12px}
.empty{color:#4e6b65;font-size:12px;text-align:center;padding:40px 0}
.menu{position:fixed;z-index:99;background:#0e1716;border:1px solid #2b4a44;min-width:180px;max-height:70vh;overflow-y:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.6);display:none}
.menu.show{display:block}
.menu .mhead{font-size:10px;letter-spacing:.2em;color:#4e8f80;padding:8px 12px;border-bottom:1px solid #1a2726}
.mitem{padding:7px 12px;font-size:12px;color:#a8bfb9;cursor:pointer;display:flex;align-items:center;gap:8px}
.mitem:hover{background:rgba(95,214,187,.12);color:#fff}
.mitem .ck{width:12px;color:#5fd6bb}
.mitem.danger{color:#c98a8a}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-thumb{background:#1d2b29}
</style>
</head>
<body>
<div class="top">
  <div class="logo">M</div>
  <div><h1>怪物图鉴</h1><div class="sub">BESTIARY · REGULATION</div></div>
  <div class="topstat">
    <span>总计<b id="tTotal">0</b></span>
    <span>阵营<b id="tFac">0</b></span>
    <button class="tool" id="btnExport">导出改动</button>
    <button class="tool" id="btnReset">重置</button>
  </div>
</div>

<div class="main">
  <aside class="side">
    <h2>主 羁 绊</h2>
    <div id="facList"></div>
    <h2 style="margin-top:16px">小 羁 绊</h2>
    <div id="minorList"></div>
    <div class="newfac" id="btnNewFac">＋ 新建阵营</div>
  </aside>

  <section class="center">
    <div class="filters ranks">
      <div class="chip on" data-rank="ALL">全部</div>
      <div class="chip" data-rank="BOSS">首领</div>
      <div class="chip" data-rank="ELITE">精英</div>
      <div class="chip" data-rank="NORMAL">普通</div>
      <input class="search" id="search" placeholder="搜索名称 / 特性 / 阵营">
    </div>
    <div class="filters" id="subFilters"></div>
    <div class="list" id="list"></div>
  </section>

  <aside class="detail" id="detail"><div class="empty">← 选择怪物查看详情<br><br>右键怪物可勾选阵营（最多 3 个）</div></aside>
</div>

<div class="menu" id="menu"></div>

<script src="data.js"></script>
<script>
const D = window.MONSTERS;
const LS_KEY = "sp_bestiary_edits_v1";

const MAX_FAC = 3;
let edits = { custom: [], members: {}, minorMembers: {} };
try { const s = localStorage.getItem(LS_KEY); if (s) edits = JSON.parse(s); } catch (e) {}
if (!edits.custom) edits.custom = [];
if (!edits.members) edits.members = {};
if (!edits.minorMembers) edits.minorMembers = {};

const ALL = [];
const _seen = new Set();
D.groups.forEach(g => g.items.forEach(i => {
  if (_seen.has(i.id)) return;        // 多阵营单位在多个组里出现，只保留一份
  _seen.add(i.id);
  ALL.push(i);
}));
const VISIBLE = () => ALL.filter(i => !i.variantOf);
const byId = Object.fromEntries(ALL.map(i => [i.id, i]));
const BASE_ORDER = D.groups.map(g => g.name).filter(n => n !== "无阵营");

function facsOf(item) {
  const m = edits.members[item.id];
  if (m && m.length) return m;
  return (item.factions && item.factions.length) ? item.factions.slice() : [];
}
function minorsOf(item) {
  const m = edits.minorMembers[item.id];
  if (m && m.length) return m;
  return (item.minors && item.minors.length) ? item.minors.slice() : [];
}

function save() { localStorage.setItem(LS_KEY, JSON.stringify(edits)); renderFacs(); render(); }

let curFac = "ALL";
function facNames() {
  const out = BASE_ORDER.slice();
  edits.custom.forEach(n => { if (!out.includes(n)) out.push(n); });
  out.push("无阵营");
  return out;
}
function counts() {
  const c = {};
  ALL.filter(i => !i.variantOf).forEach(i => {
    facsOf(i).forEach(f => { c[f] = (c[f] || 0) + 1; });
  });
  return c;
}
function minorCounts() {
  const c = {};
  ALL.filter(i => !i.variantOf).forEach(i => {
    minorsOf(i).forEach(f => { c[f] = (c[f] || 0) + 1; });
  });
  return c;
}

function renderFacs() {
  const c = counts();
  const names = facNames();
  document.getElementById("tFac").textContent = names.filter(n => n !== "无阵营" && (c[n] || 0) > 0).length;
  document.getElementById("facList").innerHTML =
    `<div class="fac ${curFac === "ALL" ? "on" : ""}" data-fac="ALL"><span class="dot"></span>全部<span class="n">${VISIBLE().length}</span></div>` +
    names.map(n => {
      const isCustom = edits.custom.includes(n);
      const cnt = n === "无阵营"
      ? ALL.filter(i => !i.variantOf && facsOf(i).length === 0).length
      : (c[n] || 0);
      return `<div class="fac ${curFac === n ? "on" : ""}" data-fac="${n}">
        <span class="dot"></span>${n}<span class="n">${cnt}</span>
        ${isCustom ? `<span class="x" data-del="${n}" title="删除阵营">✕</span>` : ""}
      </div>`;
    }).join("");

  const mc = minorCounts();
  const mnames = (D.minorBonds || []).map(b => b.name)
    .filter(n => (mc[n] || 0) > 0);
  document.getElementById("minorList").innerHTML = mnames.map(n =>
    `<div class="fac ${curFac === n ? "on" : ""}" data-fac="${n}">
      <span class="dot minor"></span>${n}<span class="n">${mc[n] || 0}</span>
    </div>`).join("") || `<div style="font-size:12px;color:#5d7570;padding:6px 10px">暂无小羁绊</div>`;
}

document.getElementById("facList").addEventListener("click", e => {
  const del = e.target.closest(".x");
  if (del) {
    const name = del.dataset.del;
    if (confirm(`删除阵营「${name}」？其成员将回到原阵营。`)) {
      edits.custom = edits.custom.filter(n => n !== name);
      Object.keys(edits.members).forEach(id => {
        edits.members[id] = edits.members[id].filter(n => n !== name);
        if (!edits.members[id].length) delete edits.members[id];
      });
      if (curFac === name) curFac = "ALL";
      save();
    }
    return;
  }
  const el = e.target.closest(".fac");
  if (!el) return;
  curFac = el.dataset.fac;
  renderFacs(); render();
});

document.getElementById("minorList").addEventListener("click", e => {
  const el = e.target.closest(".fac");
  if (!el) return;
  curFac = el.dataset.fac;
  renderFacs(); render();
});

document.getElementById("btnNewFac").onclick = () => {
  const name = prompt("新阵营名称：");
  if (!name) return;
  const n = name.trim();
  if (!n) return;
  if (facNames().includes(n)) { alert("已存在同名阵营"); return; }
  edits.custom.push(n);
  save();
  curFac = n;
  renderFacs(); render();
};

let curRank = "ALL", curSub = "ALL", keyword = "", curId = null;
document.querySelectorAll(".filters.ranks .chip").forEach(c => {
  c.onclick = () => {
    document.querySelectorAll(".filters.ranks .chip").forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    curRank = c.dataset.rank;
    render();
  };
});
const subBar = document.getElementById("subFilters");
subBar.innerHTML = `<div class="chip on" data-sub="ALL">副羁绊 · 全部</div>` +
  (D.subBonds || []).map(s => `<div class="chip" data-sub="${s.name}">${s.name}</div>`).join("");
subBar.querySelectorAll(".chip").forEach(c => {
  c.onclick = () => {
    subBar.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    curSub = c.dataset.sub;
    render();
  };
});
document.getElementById("search").addEventListener("input", e => {
  keyword = e.target.value.trim().toLowerCase();
  render();
});

function pool() {
  let items = ALL.filter(i => !i.variantOf);   // 进阶形态不单独占行
  if (curFac === "无阵营") items = items.filter(i => facsOf(i).length === 0);
  else if (curFac !== "ALL")
    items = items.filter(i => facsOf(i).includes(curFac) || minorsOf(i).includes(curFac));
  const order = { BOSS: 0, ELITE: 1, NORMAL: 2 };
  items.sort((a, b) => (order[a.rank] - order[b.rank]) || ((b.hp || 0) - (a.hp || 0)));
  if (curRank !== "ALL") items = items.filter(i => i.rank === curRank);
  if (curSub !== "ALL") items = items.filter(i => (i.subs || []).includes(curSub));
  if (keyword) {
    items = items.filter(i =>
      i.name.toLowerCase().includes(keyword) ||
      facsOf(i).join("").includes(keyword) ||
      minorsOf(i).join("").includes(keyword) ||
      (i.subs || []).join("").includes(keyword) ||
      i.tags.join("").includes(keyword));
  }
  return items;
}

const RANK_CN = { BOSS: "首领", ELITE: "精英", NORMAL: "普通" };
const RANK_CLS = { BOSS: "boss", ELITE: "elite", NORMAL: "" };

function render() {
  document.getElementById("tTotal").textContent = VISIBLE().length;
  const items = pool();
  const list = document.getElementById("list");
  if (!items.length) { list.innerHTML = `<div class="empty">没有符合条件的怪物</div>`; return; }
  list.innerHTML = items.map(i => {
    const fs = facsOf(i);
    return `<div class="row ${i.id === curId ? "on" : ""}" data-id="${i.id}">
      <div class="ic">${i.icon ? `<img src="${i.icon}" loading="lazy" alt="">` : ""}</div>
      <div>
        <div class="nm">${i.name}
          <span class="tag ${RANK_CLS[i.rank]}">${RANK_CN[i.rank]}</span>
          ${fs.map(f => `<span class="tag fac">${f}</span>`).join("")}
          ${minorsOf(i).map(f => `<span class="tag minor">${f}</span>`).join("")}
        </div>
        <div class="meta">${i.ac.length ? i.ac.map(a => `<span>${a}</span>`).join("") : "<span>无特性</span>"}</div>
      </div>
      <div class="stats"><div><b>${(i.hp || 0).toLocaleString()}</b> 血</div>
        <div><b>${i.atk}</b> 攻 · <b>${i.def}</b> 防</div></div>
    </div>`;
  }).join("");

  list.querySelectorAll(".row").forEach(r => {
    r.onclick = () => { curId = r.dataset.id; render(); showDetail(curId); };
    r.oncontextmenu = ev => { ev.preventDefault(); ev.stopPropagation(); openMenu(ev, r.dataset.id); };
  });
}

const menu = document.getElementById("menu");
const MAX_MINOR = 2;
let menuTarget = null;

// 迁移：早期把「小羁绊」当自定义主阵营保存的，搬进 minorMembers
(function migrateMinor() {
  const mset = new Set((D.minorBonds || []).map(b => b.name));
  const mainSet = new Set(D.groups.map(g => g.name));
  Object.keys(edits.members || {}).forEach(id => {
    const arr = edits.members[id] || [];
    const keep = [], move = [];
    arr.forEach(n => (mset.has(n) && !mainSet.has(n)) ? move.push(n) : keep.push(n));
    if (move.length) {
      const cur = (edits.minorMembers[id] || []).slice();
      move.forEach(n => { if (!cur.includes(n) && cur.length < MAX_MINOR) cur.push(n); });
      edits.minorMembers[id] = cur;
    }
    if (keep.length) edits.members[id] = keep; else delete edits.members[id];
  });
  edits.custom = (edits.custom || []).filter(n => !mset.has(n));
})();

function openMenu(ev, id) {
  menuTarget = id;
  const cur = facsOf(byId[id]);
  const names = facNames().filter(n => n !== "无阵营");
  const curM = minorsOf(byId[id]);
  const mnames = (D.minorBonds || []).map(b => b.name);
  menu.innerHTML =
    `<div class="mhead">主羁绊 · ${cur.length}/${MAX_FAC}</div>` +
    names.map(n => `<div class="mitem" data-fac="${n}"><span class="ck">${cur.includes(n) ? "✓" : ""}</span>${n}</div>`).join("") +
    `<div class="mitem danger" data-fac="__none__"><span class="ck"></span>清空主羁绊</div>` +
    `<div class="mhead" style="border-top:1px solid #1d2a28;margin-top:4px">小羁绊 · ${curM.length}/${MAX_MINOR}</div>` +
    mnames.map(n => `<div class="mitem" data-minor="${n}"><span class="ck">${curM.includes(n) ? "✓" : ""}</span>${n}</div>`).join("") +
    `<div class="mitem danger" data-minor="__none__"><span class="ck"></span>清空小羁绊</div>`;
  menu.style.display = "block";
  const w = 200, h = menu.offsetHeight;
  menu.style.left = Math.min(ev.clientX, window.innerWidth - w - 10) + "px";
  menu.style.top = Math.min(ev.clientY, window.innerHeight - h - 10) + "px";
}
menu.addEventListener("click", e => {
  const it = e.target.closest(".mitem");
  if (!it || !menuTarget) return;
  if (it.dataset.minor) {
    const target = it.dataset.minor;
    const curM = minorsOf(byId[menuTarget]).slice();
    if (target === "__none__") {
      delete edits.minorMembers[menuTarget];
    } else if (curM.includes(target)) {
      const next = curM.filter(n => n !== target);
      if (next.length) edits.minorMembers[menuTarget] = next;
      else delete edits.minorMembers[menuTarget];
    } else {
      if (curM.length >= MAX_MINOR) { alert(`一个怪物最多归属 ${MAX_MINOR} 个小羁绊`); return; }
      edits.minorMembers[menuTarget] = [...curM, target];
    }
    menu.style.display = "none";
    save(); if (curId === menuTarget) showDetail(curId);
    return;
  }
  const target = it.dataset.fac;
  const cur = facsOf(byId[menuTarget]).slice();

  if (target === "__none__") {
    delete edits.members[menuTarget];
    menu.style.display = "none";
    save(); if (curId === menuTarget) showDetail(curId);
    return;
  }
  const has = cur.includes(target);
  if (has) {
    const next = cur.filter(n => n !== target);
    if (next.length) edits.members[menuTarget] = next;
    else delete edits.members[menuTarget];
  } else {
    if (cur.length >= MAX_FAC) {
      alert(`一个怪物最多归属 ${MAX_FAC} 个阵营，请先取消一个。`);
      return;
    }
    edits.members[menuTarget] = [...cur, target];
  }
  menu.style.display = "none";
  save(); if (curId === menuTarget) showDetail(curId);
});
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.style.display = "none"; });
document.addEventListener("contextmenu", e => { if (!e.target.closest(".row")) menu.style.display = "none"; });

function formHtml(item, label, accent) {
  if (!item) return "";
  return `
  <div style="margin-top:${label ? 18 : 0}px">
    ${label ? `<div style="font-size:10px;letter-spacing:.24em;color:${accent};margin-bottom:8px">${label}</div>` : ""}
    <div class="dhead">
      <div class="ic">${item.icon ? `<img src="${item.icon}" alt="">` : ""}</div>
      <div>
        <div class="dname" style="font-size:${label ? 16 : 19}px">${item.name}</div>
        <div class="dfac">主羁绊：${facsOf(item).length ? facsOf(item).join(" · ") : "无"}</div>
        <div class="dfac" style="color:#9a8fd0">小羁绊：${minorsOf(item).length ? minorsOf(item).join(" · ") : "无"}</div>
        <div class="drank">${RANK_CN[item.rank]} · ${item.way}</div>
      </div>
    </div>
    <div class="sect"><h3>属 性</h3>
      <div class="grid">
        <div class="kv"><span>生命</span><b>${(item.hp || 0).toLocaleString()}</b></div>
        <div class="kv"><span>攻击</span><b>${item.atk}</b></div>
        <div class="kv"><span>防御</span><b>${item.def}</b></div>
        <div class="kv"><span>法抗</span><b>${item.res}</b></div>
        <div class="kv"><span>攻击间隔</span><b>${item.bat ?? "—"}</b></div>
        <div class="kv"><span>射程</span><b>${item.range ?? "—"}</b></div>
        <div class="kv"><span>阻挡</span><b>${item.block ?? "—"}</b></div>
        <div class="kv"><span>移速</span><b>${item.speed ?? "—"}</b></div>
      </div>
    </div>
    <div class="sect"><h3>副 羁 绊</h3>
      <div class="achips">${(item.subs || []).length ? item.ac.map(a => `<span class="ac">${a}</span>`).join("") : `<span class="ac">无</span>`}
      ${item.fly ? `<span class="ac">飞行单位</span>` : ""}</div>
    </div>
    <div class="sect"><h3>简 介</h3><div class="desc">${item.desc || "—"}</div></div>
  </div>`;
}

function showDetail(id) {
  const item = byId[id];
  if (!item) return;
  const base = item.variantOf ? byId[item.variantOf] : item;
  const adv = ALL.find(i => i.variantOf === base.id);
  const recruit = [base.tier ? `${base.tier} 阶` : "", base.cost ? `可招募 · ${base.cost} 费` : (base.recruit ? "可招募" : "")]
    .filter(Boolean).join(" · ");

  document.getElementById("detail").innerHTML =
    formHtml(base, recruit ? `初 始 形 态　${recruit}` : "初 始 形 态", "#5fd6bb") +
    (adv ? `
      <div style="margin:16px 0 0;border-top:1px dashed #24403a;padding-top:4px"></div>
      <div style="margin-top:14px">
        <div style="font-size:10px;letter-spacing:.24em;color:#e0b47a;margin-bottom:8px">进 阶 形 态（二星）</div>
        <div class="dhead">
          <div class="ic">${adv.icon ? `<img src="${adv.icon}" alt="">` : ""}</div>
          <div>
            <div class="dname" style="font-size:16px">${adv.name}</div>
            <div class="dfac" style="color:#e0b47a">${facsOf(adv).length ? facsOf(adv).join(" · ") : "无阵营"}</div>
            <div class="drank">${RANK_CN[adv.rank]} · ${adv.way}</div>
          </div>
        </div>
        <div class="sect"><h3>属 性</h3>
          <div class="grid">
            <div class="kv"><span>生命</span><b>${(adv.hp || 0).toLocaleString()}</b></div>
            <div class="kv"><span>攻击</span><b>${adv.atk}</b></div>
            <div class="kv"><span>防御</span><b>${adv.def}</b></div>
            <div class="kv"><span>法抗</span><b>${adv.res}</b></div>
            <div class="kv"><span>攻击间隔</span><b>${adv.bat ?? "—"}</b></div>
            <div class="kv"><span>射程</span><b>${adv.range ?? "—"}</b></div>
            <div class="kv"><span>阻挡</span><b>${adv.block ?? "—"}</b></div>
            <div class="kv"><span>移速</span><b>${adv.speed ?? "—"}</b></div>
          </div>
        </div>
        <div class="sect"><h3>副 羁 绊</h3>
          <div class="achips">${(adv.subs || []).length ? adv.ac.map(a => `<span class="ac">${a}</span>`).join("") : `<span class="ac">无</span>`}
          ${adv.fly ? `<span class="ac">飞行单位</span>` : ""}</div>
        </div>
        <div class="sect"><h3>简 介</h3><div class="desc">${adv.desc || "—"}</div></div>
      </div>` : "")
    + `<div class="sect"><h3>编 号</h3><div class="desc" style="font-family:monospace;font-size:11px">${base.id}${adv ? `<br>${adv.id}` : ""}</div></div>`;
}

document.getElementById("btnExport").onclick = () => {
  const data = {
    version: 2,
    exportedAt: new Date().toISOString(),
    custom: edits.custom,
    members: edits.members,
    minorMembers: edits.minorMembers,
  };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "阵营改动.json";
  a.click();
};
document.getElementById("btnReset").onclick = () => {
  if (!confirm("放弃所有手动改动，恢复默认阵营？")) return;
  edits = { custom: [], members: {}, minorMembers: {} };
  localStorage.removeItem(LS_KEY);
  curFac = "ALL";
  save();
};

renderFacs(); render();
</script>
</body>
</html>
